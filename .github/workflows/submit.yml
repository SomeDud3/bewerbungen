name: submit
on:
  workflow_dispatch:
    inputs:
      id: {description: "Stellen-ID", required: true}
concurrency: {group: submit}
permissions: {contents: write}
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q playwright==1.48.0 cryptography
      - name: Abschicken
        env: {RSA_KEY: "${{ secrets.RSA_KEY }}", ID: "${{ inputs.id }}"}
        run: cd tools && cp ../data.bin . && python cloud_submit.py "$ID"; cp data.bin ../data.bin
      - run: |
          git config user.name bewerbungs-bot && git config user.email bot@users.noreply.github.com
          git diff --quiet data.bin || git add data.bin && git commit -m "submit ${{ inputs.id }}" && git pull --rebase && git push || true
