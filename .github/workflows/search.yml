name: search
on: workflow_dispatch
concurrency: {group: submit}
permissions: {contents: write}
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: {run: {working-directory: tools}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Vorbereiten
        run: pip install -q cryptography playwright==1.48.0 anthropic && cp ../data.bin . && (sudo apt-get install -y -qq fonts-crosextra-carlito >/dev/null 2>&1 || true)
      - name: karriere.at durchsuchen
        run: python cloud_search.py karriere
      - name: jobs.at durchsuchen
        run: python cloud_search.py jobsat
      - name: Firmenportale & devjobs/willhaben
        run: python cloud_search.py portale
      - name: Stadtwerke, ÖBB, AMS, Siemens Energy (Browser)
        run: python cloud_search.py browser
      - name: Inserate prüfen
        env: {RSA_KEY: "${{ secrets.RSA_KEY }}"}
        run: python cloud_search.py pruefen
      - name: Pakete bauen (Claude)
        env: {RSA_KEY: "${{ secrets.RSA_KEY }}", ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
        run: python cloud_paket.py; cp data.bin ../data.bin
      - name: Ergebnis speichern
        working-directory: .
        run: |
          git config user.name bewerbungs-bot && git config user.email bot@users.noreply.github.com
          git diff --quiet data.bin || git add data.bin && git commit -m "suche" && git pull --rebase && git push || true
